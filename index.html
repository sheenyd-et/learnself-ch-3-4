--brand);color:white;border-radius:11px;padding:11px 17px;font-weight:800;min-height:44px}.btn.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}.btn.ghost{background:var(--brand2);color:var(--brand);border-color:var(--line)}.btn.danger{background:var(--paper);border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label,.label{font-size:.9rem;font-weight:750;color:var(--muted)}input[type=text],input[type=email],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px;max-width:100%;width:100%}textarea{line-height:1.7;min-height:95px;resize:vertical}.hint{font-size:.88rem;color:var(--muted);line-height:1.7}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--brand2);border-radius:30px;padding:6px 11px;font-size:.8rem;font-weight:800;color:var(--brand)}.chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin:3px 6px 3px 0}.warning{background:var(--brand2);border-left:4px solid var(--brand);padding:12px 15px;line-height:1.7;border-radius:7px}.dangertext{color:var(--bad)}.oktext{color:var(--good)}.muted{color:var(--muted)}.hide{display:none!important}.theme-grid{display:flex;gap:7px;flex-wrap:wrap}.theme-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:9px}.theme-btn.selected{outline:3px solid var(--brand);outline-offset:1px}.sec-row{display:grid;grid-template-columns:1fr auto 110px;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.sec-row:last-child{border:0}.sec-row input{min-width:74px}.progress-bg{height:9px;background:var(--line);border-radius font-size:1rem}.report-answer{line-height:1.7}.report-answer p{margin:4px 0}.report-footer{margin-top:25px;padding-top:18px;border-top:3px solid var(--ink)}.report-footer h3{margin-top:0}#printArea{display:none}.footer{padding-top:25px;text-align:center;font-size:.82rem;color:var(--muted)}.exam-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;z-index:99;box-shadow:var(--shadow);max-width:450px}.review-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.review-filter button{font-size:.85rem}.numgrid{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.numgrid button{height:35px;min-width:35px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--paper)}.numgrid button.selected{background:var(--brand);color:white;border-color:var(--brand)}.numgrid button.done{border-color:var(--good)}.printhead{display:none}

/* 解析待確認與語音報讀工具 */
.issue-panel{border:2px solid var(--line);border-radius:14px;padding:16px;margin:13px 0;background:var(--paper)}
.issue-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}
.issue-row:last-child{border:0}.issue-reasons{font-size:.88rem;color:var(--muted);line-height:1.7}.review-item:target{outline:3px solid var(--brand);outline-offset:3px}
.math-inline{display:inline-block!important;vertical-align:middle!important;max-height:4.4em!important;max-width:min(100%,350px)!important;width:auto!important;margin:0 .12em!important;object-fit:contain}.math-diagram{display:block!important;max-height:480px!important;max-width:min(100%,700px)!important;margin:12px auto!important;object-fit:contain}.math-missing{display:inline-block;border:2px dotted #b35704;background:#fff1cf;color:#442608;border-radius:6px;padding:2px 7px;font-weight:800;vertical-align:middle}.math-warning{border-left:5px solid #c86b00;padding:12px;margin:12px 0;background:var(--brand2);line-height:1.7}html.contrast .math-missing{background:#000;color:#fff;border-color:#fff}html.contrast .math-warning{background:#000;border-color:#fff}html.contrast .math-inline,html.contrast .math-diagram{background:#fff;border-radius:3px;padding:2px}/* 可存成 HTML 數學分數的正式上下排版；不是只有斜線字串 */
.math-fraction{display:inline-block;vertical-align:middle;white-space:nowrap;font-size:1.08em;margin:0 .1em}
.math-fraction math{font-family:"Cambria Math","STIX Two Math",serif; font-size:1.15em;vertical-align:middle}
.math-help{background:var(--brand2);padding:11px 13px;border-radius:10px;margin:8px 0 16px;font-size:.88rem;line-height:1.75}
.math-help code{font-family:monospace;font-size:1.04em;user-select:all}
.math-preview{border:1px dashed var(--line);padding:10px;margin:7px 0;border-radius:9px;min-height:30px}
.math-rich p{margin:5px 0;line-height:2}.math-preview-grid{display:flex;gap:10px;flex-wrap:wrap}.math-preview-grid img{max-width:200px;max-height:120px;object-fit:contain;background:#fff;border:1px solid var(--line)}

.issue-flag{display:inline-block;font-size:.83rem;color:var(--warn);border:1px solid var(--warn);padding:4px 8px;border-radius:8px;line-height:1.6}

.voice-controls input[type=range]{width:100%;accent-color:var(--brand)}
.voice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.voice-actions .btn{min-width:95px}
.voice-toggle{display:inline-flex;gap:8px;align-items:center;font-weight:750;cursor:pointer}
.voice-custom{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0}

.math-symbol-guide summary{cursor:pointer;font-size:1.06rem;font-weight:700;padding:.6em}.math-symbol-table{border-collapse:collapse;width:100%;font-size:.92em}.math-symbol-table td,.math-symbol-table th{border:1px solid var(--line);padding:9px;vertical-align:top}.math-symbol-table code{white-space:pre-wrap;overflow-wrap:anywhere}.math-universal math{font-size:1.14em}.math-symbol-table .math-preview{margin:8px 0}.math-symbol-guide{overflow:auto}html.contrast .math-symbol-table td,html.contrast .math-symbol-table th{border-color:white}

/* 10.0：數學行內公式與本文字級同步；大圖保留獨立尺寸。 */
html{--math-inline-height:1.55em;--math-native-size:1em}
html[data-math-layout="compact"]{--math-inline-height:1.20em;--math-native-size:.94em}
html[data-math-layout="normal"]{--math-inline-height:1.55em;--math-native-size:1em}
html[data-math-layout="large"]{--math-inline-height:1.95em;--math-native-size:1.13em}
.content img.math-inline,.choice img.math-inline,.reading img.math-inline,.feedback img.math-inline,.math-preview img.math-inline,
img.math-inline{
 display:inline-block!important; box-sizing:content-box!important;
 height:var(--math-inline-height)!important; width:auto!important;
 max-height:2.2em!important; max-width:min(100%,22em)!important;
 min-width:0!important; object-fit:contain!important;
 vertical-align:-.27em!important; margin:0 .07em!important;
 border:0!important; box-shadow:none!important;
}
.content img.math-diagram,.reading img.math-diagram,img.math-diagram{width:auto!important;height:auto!important;max-width:100%!important;max-height:430px!important;display:block!important;object-fit:contain!important}
.math-fraction,.math-universal{font-size:var(--math-native-size)!important;line-height:1.3!important;vertical-align:-.1em!important;white-space:nowrap}
.math-fraction math,.math-universal math{font-size:1em!important;line-height:1.15!important}
.choice>span:not(.choice-label){min-width:0;overflow-wrap:anywhere;line-height:1.55}
.question-title .math-inline,.choice .math-inline{break-inside:avoid}
.math-layout-menu{position:relative;display:inline-block;vertical-align:middle;margin-left:4px}
.math-layout-menu summary{list-style:none;cursor:pointer;white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:.88rem;font-weight:700}
.math-layout-menu summary::-webkit-details-marker{display:none}
.math-layout-popover{position:absolute;right:0;top:calc(100% + 6px);width:245px;z-index:999;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 30px #0002;border-radius:12px;padding:13px}
.math-layout-popover label{display:block;font-weight:700;margin-bottom:8px;font-size:.88rem}
.math-layout-popover select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--paper);padding:6px 8px}

@media print{img.math-inline{height:1.32em!important;max-height:1.75em!important}.math-fraction,.math-universal{font-size:1em!important}.math-layout-menu{display:none!important}}


/* 14.0 資料表格：依容器寬度自動排版，不因單一格過寬撐爆手機。 */
.content .docx-data-table,.review-item .docx-data-table,.reading .docx-data-table{
 border-collapse:collapse;width:auto;max-width:100%;table-layout:auto;font-size:0.94em;
 margin:.65em 0 .15em;line-height:1.45;
}
.docx-data-table th,.docx-data-table td{

 vertical-align:middle;white-space:normal;word-break:keep-all;
}
.docx-data-table th{font-weight:700;background:var(--brand2);color:var(--ink)}
.docx-data-table .row-heading{font-weight:600}
.docx-table-caption{caption-side:bottom;font-size:.82em;color:var(--muted);text-align:right;padding-top:3px}
.table-editor{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;background:var(--brand2)}
.table-editor summary{cursor:pointer;font-weight:700}
.table-editor .table-tsv{font-family:ui-monospace,Consolas,monospace;min-height:120px;white-space:pre;overflow:auto}
html.contrast .docx-data-table th,html.contrast .docx-data-table td{border:2px solid #fff!important;color:#fff!important;background:#000!important}
html.contrast .table-editor{background:#000!important;color:#fff!important;border:2px solid #fff}
@media(max-width:640px){.content .docx-data-table{font-size:.82em}.docx-data-table td,.docx-data-table th{padding:.25em .35em}}

/* APP 19: complete groups stay visible on one page. */
.atomic-exam-unit{display:flex;flex-direction:column;gap:16px}
.atomic-subquestion{border:1px solid var(--line);border-radius:12px;padding:16px;break-inside:avoid}
.atomic-subquestion:first-child{margin-top:3px}
.group-subheading{font-size:1.06rem;margin:0 0 12px;color:var(--brand)}
.matching-answer-field select{max-width:440px;width:100%;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.report-sub{margin-bottom:12px;padding:10px 0;border-bottom:1px dotted #aaa;break-inside:avoid}
.report-sub:last-child{border-bottom:0}
@media (max-width:600px){.atomic-subquestion{padding:10px}}

/* APP 20: mathematically typeset exponents stay aligned with surrounding text */
.algebra-inline{display:inline-block;vertical-align:-.12em;white-space:nowrap;max-width:100%;line-height:1.1!important;margin:0 .03em;}
.algebra-inline math{font-size:1em!important;line-height:1.1!important;vertical-align:middle;}
.content .algebra-inline,.choice .algebra-inline,.reading .algebra-inline,.feedback .algebra-inline{break-inside:avoid;}
@media print{.algebra-inline{font-size:1em!important;break-inside:avoid;}}

/* APP 21：常駐的一鍵清空入口；不隨頁面切換消失 */
.quick-clear{margin-left:auto;white-space:nowrap;align-self:center;box-shadow:0 1px 0 var(--line)}
.quick-clear:not(:disabled):hover{filter:brightness(.95);outline:2px solid var(--bad);outline-offset:2px}
@media(max-width:600px){.quick-clear{margin-left:0;width:100%;justify-content:center}}
html.contrast .quick-clear:not(:disabled){color:#fff!important;border:2px solid #fff!important;background:#000!important}

/* APP 22: PDF error book + mobile native file sharing. */
.pdf-mail-panel{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:17px;margin-top:17px}
.pdf-mail-panel h3{margin:0 0 10px}.pdf-mail-panel .pdf-mail-steps{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}
.pdf-mail-panel .pdf-mail-steps .btn{min-width:148px}
.pdf-mail-status{border-left:3px solid var(--brand);padding:10px 12px;margin:9px 0;background:var(--brand2);line-height:1.6;font-size:.88rem}
.pdf-mail-help{margin:10px 0 0;font-size:.86rem;line-height:1.8;color:var(--muted)}
.pdf-mail-status[role=status]{white-space:pre-wrap}
.pdf-capture,.pdf-capture *{box-sizing:border-box!important}
.pdf-capture{width:720px;max-width:720px;background:#fff!important;color:#111!important;font:16px/1.6 Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif!important;padding:4px}
.pdf-capture h1{font-size:27px;margin:0 0 10px}.pdf-capture h2{font-size:22px}.pdf-capture h3{font-size:19px;margin:8px 0}
.pdf-capture .printhead{padding:0 0 12px;border-bottom:1px solid #bbb}
.pdf-capture .report-item{margin:0 0 10px;border-bottom:1px solid #ccc;padding:10px 0;page-break-inside:avoid;break-inside:avoid}
.pdf-capture .report-sub{margin:9px 0}.pdf-capture .report-sub p{margin:5px 0}
.pdf-capture .content{line-height:1.65;font-size:16px;overflow-wrap:anywhere}
.pdf-capture .content img,.pdf-capture img{max-width:100%!important;max-height:320px!important;height:auto!important;object-fit:contain}
.pdf-capture .reading{background:#f5f5f5!important;color:#111!important;border:1px solid #aaa!important;padding:12px;page-break-inside:avoid}
.pdf-capture table{border-collapse:collapse;width:100%;table-layout:auto}.pdf-capture td,.pdf-capture th{border:1px solid #777;padding:5px;vertical-align:top}
.pdf-capture .report-footer{margin-top:20px;page-break-before:always;break-before:page}
.pdf-capture .report-answer{page-break-inside:avoid;break-inside:avoid;margin:9px 0;padding:5px 0;border-bottom:1px solid #eee}

/* APP 23: 觸控計算區可收合，始終獨立於作答欄位及教師題庫資料。 */
.scratch-toggle{white-space:nowrap}
.scratch-panel{position:fixed;right:12px;bottom:12px;width:min(610px,calc(100vw - 24px));max-height:min(76dvh,720px);background:var(--paper);color:var(--ink);border:2px solid var(--brand);border-radius:17px;box-shadow:0 12px 46px #001b4170;z-index:250;display:flex;flex-direction:column;overflow:hidden}
.scratch-panel[hidden],.report-preview[hidden]{display:none!important}
.scratch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand2);padding:10px 13px;border-bottom:1px solid var(--line)}
.scratch-head strong{font-size:1.05rem}.scratch-body{padding:11px 12px;overflow:auto;overscroll-behavior:contain}
.scratch-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 10px}

.report-preview-dialog{background:var(--paper);color:var(--ink);width:min(980px,100%);height:min(94dvh,100%);display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.report-preview-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}

athEquationCount":0,"numbered":true,"fieldNumber":82,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["B"],"answerNote":"","explanation":"題幹與(Ａ)(Ｃ)(Ｄ)動詞(Ｂ)副詞。","answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":82,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：題幹與(Ａ)(Ｃ)(Ｄ)動詞(Ｂ)副詞。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-83","section":"single","number":83,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )「凡天下事不可輕忽，雖至微至易者，皆當以慎重處之。慎重者，敬也。當無事時，敬以自持；而有事時，即敬之以應事。務必謹終如始，慎修思永，習而安焉，自無廢事。」關於康熙　教子庭訓一文，其意涵與下列何者最相近？　(Ａ)君子之學貴慎始　(Ｂ)靜以修身，儉以養德　(Ｃ)居處恭，執事敬，與人忠　(Ｄ)小者大之漸，微者著之萌。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":83,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["C"],"answerNote":"","explanation":"題幹強調處事應抱持謹慎態度，無論事情大小、難易，皆應以「敬」的態度對待，故選(Ｃ)在家要謙恭有禮，做事要認真敬業，待人要忠誠。(Ａ)君子做學問，最重要的就是開始時要謹慎。強調學習起點的重要性(Ｂ)以寧靜來提高自身的修養，以節儉來培養自己的品德。強調內在修養的方式(Ｄ)小事情是發展為大事情的開始，細微的徵兆是將來顯著變化的萌芽。強調重視細節、防微杜漸。題幹譯：對於天下發生的任何事情，都不能忽視、掉以輕心，即便是最微小最簡單的事情，都應當慎重對待。慎重，就是所謂的「敬」。在沒有事的時候，用「敬」來約束自己的操行；在有事的時候，以恭敬的心去應對一切。一定要謹慎地結束，一如謹慎地開始，謹慎修持讓敬意永存，不斷修習漸成習慣，自然就沒有做不成的事。","answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":83,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：題幹強調處事應抱持謹慎態度，無論事情大小、難易，皆應以「敬」的態度對待，故選(Ｃ)在家要謙恭有禮，做事要認真敬業，待人要忠誠。(Ａ)君子做學問，最重要的就是開始時要謹慎。強調學習起點的重要性(Ｂ)以寧靜來提高自身的修養，以節儉來培養自己的品德。強調內在修養的方式(Ｄ)小事情是發展為大事情的開始，細微的徵兆是將來顯著變化的萌芽。強調重視細節、防微杜漸。題幹譯：對於天下發生的任何事情，都不能忽視、掉以輕心，即便是最微小最簡單的事情，都應當慎重對待。慎重，就是所謂的「敬」。在沒有事的時候，用「敬」來約束自己的操行；在有事的時候，以恭敬的心去應對一切。一定要謹慎地結束，一如謹慎地開始，謹慎修持讓敬意永存，不斷修習漸成習慣，自然就沒有做不成的事。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-84","section":"single","number":84,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )下列「　」中的字，何者將「名詞」當「動詞」使用？　(Ａ)中通外直，不「蔓」不枝　(Ｂ)亭亭淨「植」　(Ｃ)牡丹之「愛」　(Ｄ)「濯」清漣而不妖。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":84,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["A"],"answerNote":"","explanation":"(Ａ)本是指藤蔓，在這裡指蔓延細莖。","answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":84,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)本是指藤蔓，在這裡指蔓延細莖。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-85","section":"single","number":85,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )有關「物」以「人」為知己的敘述，下列何項正確？　(Ａ)茶—陸羽　(Ｂ)梅—太真（楊貴妃）　(Ｃ)琵琶—和靖（林逋）　(Ｄ)鵝—子猷（王徽之）。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":85,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["A"],"answerNote":"","explanation":"(Ｂ)林和靖(Ｃ)王昭君(Ｄ)王羲之。","answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":85,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ｂ)林和靖(Ｃ)王昭君(Ｄ)王羲之。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-86","section":"single","number":86,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )下列「　」中的字，何者讀音前後「不同」？　(Ａ)「予」獨愛蓮／「予」取予求　(Ｂ)出淤「泥」而不染／「泥」古不化　(Ｃ)陶後「鮮」有聞／以約失之者，「鮮」矣　(Ｄ)可「遠」觀而不可褻玩焉／「遠」渡重洋。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":86,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["B"],"answerNote":"","explanation":"(Ａ)ㄩˊ(Ｂ)ㄋㄧˊ／ㄋㄧˋ(Ｃ)ㄒㄧㄢˇ(Ｄ)ㄩㄢˇ。","answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":86,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)ㄩˊ(Ｂ)ㄋㄧˊ／ㄋㄧˋ(Ｃ)ㄒㄧㄢˇ(Ｄ)ㄩㄢˇ。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-87","section":"single","number":87,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )下列的成語中，何者「不是」專用於女性？　(Ａ)河東獅吼　(Ｂ)里仁為美　(Ｃ)身懷六甲　(Ｄ)巾幗鬚眉。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":87,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["B"],"answerNote":"","explanation":"(Ａ)用以譏嘲妻子凶悍，使丈夫畏懼(Ｂ)指敦親睦鄰(Ｃ)古稱女子懷孕(Ｄ)指有男子氣概的女子。","answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":87,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)用以譏嘲妻子凶悍，使丈夫畏懼(Ｂ)指敦親睦鄰(Ｃ)古稱女子懷孕(Ｄ)指有男子氣概的女子。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-88","section":"single","number":88,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )白居易在京兆府新栽蓮詩中，對東溪蓮有一段描述：「下有青泥汙，馨香無復全。上有紅塵撲，顏色不得鮮。物性猶如此，人事亦宜然。託根非其所，不如遭棄捐。」此段文字的涵義為何？　(Ａ)處於汙濁的環境，應當潔身自愛　(Ｂ)挫折與磨難往往能增長人的智慧　(Ｃ)良善的本質不會受惡劣環境的影響　(Ｄ)環境影響人甚鉅，應慎選立身之處。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":88,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["D"],"answerNote":"","explanation":"語譯：水底下有青綠色的汙泥，蓮花不再有馨香的味道。水面上有車馬揚起的沙土覆蓋著花瓣，花瓣的顏色也不再鮮豔。物品的性質尚且是這樣，人間的事也應該是如此。與其把根託付在不合適的地方，還不如遭受被丟棄的對待。","answerParts":[{"kind":"p","text":"答案：(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":88,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：語譯：水底下有青綠色的汙泥，蓮花不再有馨香的味道。水面上有車馬揚起的沙土覆蓋著花瓣，花瓣的顏色也不再鮮豔。物品的性質尚且是這樣，人間的事也應該是如此。與其把根託付在不合適的地方，還不如遭受被丟棄的對待。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-89","section":"single","number":89,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":89,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　蓮花池與思春的關係，李商隱這首寫得非常明顯：","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"￰0￱","images":[],"inlineImages":[{"src":"","legacy":true,"ext":"emf","originalFormat":"emf","originalPath":"word/media/image2.emf","formulaRestored":false,"vectorRestored":false,"needsReview":false,"alt":"無法辨識的舊式公式／表格（可在校對區重建）","rid":"rId4"}],"mathEquationCount":1,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　這首詩用了很多愛情的典故。「輕雷」用漢　司馬相如　長門賦：「雷殷殷而響起兮，聲象君之車音。」遠方雷聲，就像你的馬車的車輪聲，以現在來說就是引擎聲了。\n　　「賈氏窺簾」，晉朝　韓壽是賈充的屬下，長得「美姿容」，賈充的女兒常在簾後偷窺他，後來兩人暗通款曲。此事曝光，是因為賈充聞到韓壽身上有一種特殊香味，這是皇上特別賜給幾個大臣的異香，所以一定是女兒給他的。女兒與屬下幽會這種事見不得人，就乾脆讓他們結婚了。\n　　「宓妃留枕」，當年曹植深愛甄宓，但宓嫁給了曹丕。宓死後要曹丕將自己出嫁時帶來的玉帶金縷枕送給曹植，她也知道曹植對她的一往情深。\n　　這樣就可以讀這首詩了：春風颯颯地吹，吹來了細細的雨，蓮花池那邊傳出輕輕的雷聲，讓我想起你。金蟾形狀的香爐正焚燒著香，有人從玉虎轆轤的石井打水回來了。我的心情，就像當年賈女在簾子後面偷窺那位韓姓少年郎，我們最終也能廝守嗎？或是，我只能如甄宓一樣，在死後將枕頭送給你？我的春心啊，請不要爭著與花朵一起開放，因為一寸相思，只會像金爐裡的香，燒成一寸灰。\n　　李商隱的詩真是要細細讀，這裡會提到韓壽偷「香」，是由「燒香」引起的聯想。牽絲（諧音「思」），則聯想到宓妃不斷的情思。「香」「絲」合起來又是「相思」。\n　　看看，蓮花池是不是很危險？危險到一寸相思一寸灰了。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（趙啟麟　每日讀詩詞）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"作者引用李商隱的詩中有「燒香」與「牽絲」，「香」諧音「相」，「絲」諧音「思」，為「諧音雙關」。下列「　」中所使用的雙關，何者也是使用此種方式？　(Ａ)志士幽人莫怨嗟，古來「材大」難為用　(Ｂ)朝登涼臺上，夕宿蘭池裡。乘月採芙蓉，夜夜得「蓮子」　(Ｃ)始欲識郎時，兩心望如一。理絲入殘機，何悟「不成匹」　(Ｄ)向晚意不適，驅車登古原。夕陽無限好，只是近「黃昏」。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["B"],"answerNote":"","explanation":"(Ａ)「材大」既指古柏，又兼指材大之人，詞義雙關(Ｂ)「蓮子」即憐子，諧音雙關(Ｃ)「不成匹」一方面指未織成一匹完整的布，另一方面指「無法匹配」，詞義雙關(Ｄ)字面上是指實際的時間，兼指作者內心遲暮的感受，詞義雙關。","answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":89,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)「材大」既指古柏，又兼指材大之人，詞義雙關(Ｂ)「蓮子」即憐子，諧音雙關(Ｃ)「不成匹」一方面指未織成一匹完整的布，另一方面指「無法匹配」，詞義雙關(Ｄ)字面上是指實際的時間，兼指作者內心遲暮的感受，詞義雙關。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-90","section":"single","number":90,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )下列稱號與人物的配對，何者「錯誤」？　(Ａ)蘇轍：東坡居士　(Ｂ)周敦頤：濂溪先生　(Ｃ)王冕：梅花屋主　(Ｄ)李白：青蓮居士。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":90,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["A"],"answerNote":"","explanation":"(Ａ)蘇軾。","answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":90,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)蘇軾。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"single-91","section":"single","number":91,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   )下列「　」中的字，何組前後意思「不同」？　(Ａ)陶後「鮮」有聞／寡廉「鮮」恥　(Ｂ)「予」謂／「予」獨愛蓮之出淤泥而不染　(Ｃ)「自」李唐來／有朋「自」遠方來　(Ｄ)香遠「益」清／延年「益」壽。","images":[],"inlineImages":[],"mathEqua ，從今年開始派遣一名衙校，騎乘驛馬，一天一夜趕送到京城。所進貢的不過只有姚黃、魏紫等著名的牡丹品種寥寥數朵。將菜葉鋪墊在竹籠子中，用來保護牡丹花瓣，讓它不受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。","answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":97,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：由「舊不進花」與「所進不過姚黃魏紫三數朵」可知「姚黃魏紫」指的是本文所敘述的主角「牡丹花」，故選(Ａ)。(Ｂ)從「春時城中無分貴賤皆插花，雖負擔者亦然」一句可知洛陽城中無論貴賤皆購買牡丹(Ｃ)從「以蠟封蒂」可知只有用蠟將「蒂頭」封住(Ｄ)從「以菜葉實竹籠子，藉覆之使馬上不動搖」可知菜葉的主要作用是鋪墊填充，保護牡丹花瓣，讓它不受碰撞。題幹出自歐陽脩　洛陽牡丹記　風俗記第三。題幹譯：洛陽人的習俗，大多喜歡牡丹，春天時城中不論地位高低的人都喜歡插上牡丹花，就算是扛著擔子的勞動者也是如此。牡丹盛開時，士大夫與平民爭相遊覽賞花，直到牡丹謝了才停止。從洛陽到開封有六個驛站，從前沒有進貢牡丹，從今年開始派遣一名衙校，騎乘驛馬，一天一夜趕送到京城。所進貢的不過只有姚黃、魏紫等著名的牡丹品種寥寥數朵。將菜葉鋪墊在竹籠子中，用來保護牡丹花瓣，讓它不受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"cloze-1-1","section":"cloze","number":1,"sub":1,"groupId":"cloze-1","parts":[{"kind":"p","text":"（　）(１)(Ａ)卓然　(Ｂ)蕭然　(Ｃ)欣然　(Ｄ)慨然。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["A"],"answerNote":"","explanation":"","answerParts":[{"kind":"p","text":"答案：(１)(Ａ)；(２)(Ｂ)；(３)(Ｄ)；(４)(Ｃ)；(５)(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":1,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"cloze-1-2","section":"cloze","number":1,"sub":2,"groupId":"cloze-1","parts":[{"kind":"p","text":"（　）(２)(Ａ)閒雲野鶴　(Ｂ)高風亮節　(Ｃ)拔地擎天　(Ｄ)明月清風。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["B"],"answerNote":"","explanation":"","answerParts":[{"kind":"p","text":"答案：(１)(Ａ)；(２)(Ｂ)；(３)(Ｄ)；(４)(Ｃ)；(５)(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":1,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"cloze-1-3","section":"cloz 807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"group-6-1","section":"group","number":6,"sub":1,"groupId":"group-6","parts":[{"kind":"p","text":"（　）(１)故事中的溺水者「兩搖其首」，他所表現出的行為，可用下列何者來加以形容？　(Ａ)對同伴的不信任　(Ｂ)溺水時的慌亂無措　(Ｃ)嗜財如命的頑固態度　(Ｄ)貪生怕死的膽小模樣。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["C"],"answerNote":"","explanation":"(１)由溺水者明知錢財拖累自己，仍搖頭不願拋棄，最終溺死，可見其嗜財如命、執迷不悟，故選(Ｃ)。\n(２)(Ａ)指選擇好的、正確的事去做，且堅持不變。\n(３)(Ａ)全文以寓言筆法，藉由「捨不得財物導致喪命」的情節，啟示我們應有正確的價值觀與取捨的智慧，而不被物欲蒙蔽。\n語譯：　　永州的老百姓都善於游水。一天，河水非常猛烈，當時有五六個百姓坐小船渡過湘水。渡到河中間，船破了，所有的人都會游泳。\n　　其中一個百姓用盡全力卻不能游兩三米。他的同伴說：「你是最善於游泳的，今天怎麼落後了呢？」他回答說：「我腰上纏著一千串銅錢，很重，這樣才落後了。」對方又問說：「為什麼不扔掉它？」他不回答，搖搖他的頭。\n　　過了一會兒更累了。已經上岸的人站在岸上呼喊叫道：「你真是太蠢了，你的心被蒙蔽住，你的人都快溺死了，還怎麼花錢啊？」他又是搖著他的頭，於是便被溺死了。\n　　我對這件事感到哀傷，能有不為財富，而犧牲自己寶貴性命的人嗎？","answerParts":[{"kind":"p","text":"答案：(１)(Ｃ)；(２)(Ａ)；(３)(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":6,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(１)由溺水者明知錢財拖累自己，仍搖頭不願拋棄，最終溺死，可見其嗜財如命、執迷不悟，故選(Ｃ)。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"(２)(Ａ)指選擇好的、正確的事去做，且堅持不變。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"(３)(Ａ)全文以寓言筆法，藉由「捨不得財物導致喪命」的情節，啟示我們應有正確的價值觀與取捨的智慧，而不被物欲蒙蔽。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"語譯：　　永州的老百姓都善於游水。一天，河水非常猛烈，當時有五六個百姓坐小船渡過湘水。渡到河中間，船破了，所有的人都會游泳。\n　　其中一個百姓用盡全力卻不能游兩三米。他的同伴說：「你是最善於游泳的，今天怎麼落後了呢？」他回答說：「我腰上纏著一千串銅錢，很重，這樣才落後了。」對方又問說：「為什麼不扔掉它？」他不回答，搖搖他的頭。\n　　過了一會兒更累了。已經上岸的人站在岸上呼喊叫道：「你真是太蠢了，你的心被蒙蔽住，你的人都快溺死了，還怎麼花錢啊？」他又是搖著他的頭，於是便被溺死了。\n　　我對這件事感到哀傷，能有不為財富，而犧牲自己寶貴性命的人嗎？","images":[ 受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。一般洛陽人家家有牡丹，而很少有大樹，原因是牡丹需要嫁接，不嫁接品種會退化。","answerParts":[{"kind":"p","text":"答案：(１)(Ｂ)；(２)(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":9,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(１)(Ｂ)由「自今徐州　李相迪為留守時……所進不過姚黃、魏紫三數朵」可知。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"(２)(Ｄ)由「植物的根、莖、葉等營養器官通過與母體脫離後，即能夠發育成新的個體」可知。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"語譯：【甲】洛陽百姓的習俗，大多是喜歡牡丹花，一到春天，城裡不分貴賤都要插花，即便是挑擔子賣苦力的也不例外。牡丹花開的時候，士大夫和一般百姓都爭著遊春賞花。往往在有亭臺池塘的古廟或廢宅處，形成臨時街市，搭上帳幕，笙歌之聲遠近相聞。最熱鬧的要數月陂堤、張家園、棠棣坊、長壽寺東街與郭令宅等幾處。要到牡丹花落，街市才會撤掉。洛陽到東京（開封）有六個驛站，原先洛陽並不向京城進獻牡丹花。自徐州　李相迪任「留守」一職後，才開始向東京進獻牡丹。每年派衙校一員，騎乘驛馬，一天一夜趕到京師。所進獻的不過是姚黃、魏紫三數朵。將菜葉鋪墊在竹籠子中，用來保護牡丹花瓣，使花在驛馬上不受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。一般洛陽人家家有牡丹，而很少有大樹，原因是牡丹需要嫁接，不嫁接品種會退化。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"group-9-2","section":"group","number":9,"sub":2,"groupId":"group-9","parts":[{"kind":"p","text":"（　）(２)甲文中提到「蓋其不接則不佳」，請根據乙文判斷牡丹花的嫁接屬於無性生殖中的哪一種類型？　(Ａ)分裂生殖　(Ｂ)出芽生殖　(Ｃ)斷裂生殖　(Ｄ)營養器官繁殖。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["D"],"answerNote":"","explanation":"(１)(Ｂ)由「自今徐州　李相迪為留守時……所進不過姚黃、魏紫三數朵」可知。\n(２)(Ｄ)由「植物的根、莖、葉等營養器官通過與母體脫離後，即能夠發育成新的個體」可知。\n語譯：【甲】洛陽百姓的習俗，大多是喜歡牡丹花，一到春天，城裡不分貴賤都要插花，即便是挑擔子賣苦力的也不例外。牡丹花開的時候，士大夫和一般百姓都爭著遊春賞花。往往在有亭臺池塘的古廟或廢宅處，形成臨時街市，搭上帳幕，笙歌之聲遠近相聞。最熱鬧的要數月陂堤、張家園、棠棣坊、長壽寺東街與郭令宅等幾處。要到牡丹花落，街市才會撤掉。洛陽到東京（開封）有六個驛站，原先洛陽並不向京城進獻牡丹花。自徐州　李相迪任「留守」一職後，才開始向東京進獻牡丹。每年派衙校一員，騎乘驛馬，一天一夜趕到京師。所進獻的不過是姚黃、魏紫三數朵。將菜葉鋪墊在竹籠子中，用來保護牡丹花瓣，使花在驛馬上不受碰撞，並用蠟封存牡丹蒂頭，於是可以數日不凋謝。一般洛陽人家家有牡丹，而很少有大樹，原因是牡丹需要嫁接 ，很遺憾無法和他活在同一個時代。","answerParts":[{"kind":"p","text":"答案：(１)(Ｂ)；(２)(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":10,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}],"explanationParts":[{"kind":"p","text":"解析：(１)(Ａ)把自己的情意寄託在酒中(Ｃ)文章的意境氣勢磅礡，直上雲霄(Ｄ)非常仰慕他的美德，很遺憾無法和他活在同一個時代。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"(２)(Ｄ)文中闡述陶淵明的創作特色與美德，並說明作者對其崇仰之情，而未提及後世文壇是否深受陶淵明的影響。(Ａ)由「陶淵明詩篇篇有酒」可知(Ｂ)由「其文章不群……莫之與京」可知(Ｃ)由「余愛嗜其文……恨不同時」可知。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"},{"kind":"p","text":"語譯：　　有人懷疑陶淵明的詩篇篇都有酒，我觀察他的本意不在酒上，而是把自己的情趣寄託在酒中。他的文章超群出眾，文辭精妙挺拔，文章氣勢豪放，旨意鮮明，超越眾多的作品，其文章起伏跌宕，清朗通達，無人能比。詩文氣勢如橫絕大江後斜出一股清流，直上雲端後又衝向天際。談論時事見解精闢，發人深省；談到抱負則曠達而率真。加上他堅貞的志向恆久不變，安貧樂道，苦守節操，不把親身耕種當作恥辱，也不因家境窮困而憂愁。如果不是賢者堅守志向，不與世俗同流合汙，誰能達到這樣的境界？我非常喜歡他的詩文，愛不釋手，也非常仰慕他的美德，很遺憾無法和他活在同一個時代。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_b22807fb-d250-4252-b2d0-dc1ba9c9757a"}]},{"id":"group-10-2","section":"group","number":10,"sub":2,"groupId":"group-10","parts":[{"kind":"p","text":"（　）(２)根據本文，無法得知下列何者？　(Ａ)陶淵明詩多以酒為寫作題材　(Ｂ)陶淵明詩文在當時獨樹一格　(Ｃ)作者對陶淵明極為欣賞崇敬　(Ｄ)後世文壇深受陶淵明的影響。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}],"correct":["D"],"answerNote":"","explanation":"(１)(Ａ)把自己的情意寄託在酒中(Ｃ)文章的意境氣勢磅礡，直上雲霄(Ｄ)非常仰慕他的美德，很遺憾無法和他活在同一個時代。\n(２)(Ｄ)文中闡述陶淵明的創作特色與美德，並說明作者對其崇仰之情，而未提及後世文壇是否深受陶淵明的影響。(Ａ)由「陶淵明詩篇篇有酒」可知(Ｂ)由「其文章不群……莫之與京」可知(Ｃ)由「余愛嗜其文……恨不同時」可知。\n語譯：　　有人懷疑陶淵明的詩篇篇都有酒，我觀察他的本意不在酒上，而是把自己的情趣寄託在酒中。他的文章超群出眾，文辭精妙挺拔，文章氣勢豪放，旨意鮮明，超越眾多的作品，其文章起伏跌宕，清朗通達，無人能比。詩文氣勢如橫絕大江後斜出一股清流，直上雲端後又衝向天際。談論時事見解精闢，發人深省；談到抱負則曠達而率真。加上他堅貞的志向恆久不變，安貧樂道，苦守節操，不把親身耕種當作恥辱，也不因家境窮困而憂愁。如果不是賢者堅守志向，不與世俗同流合汙，誰能達到這樣的境界？我非常喜歡他的詩文，愛不釋手，也非常仰慕他的美德，很遺憾無法和他活在同一個時代。","an ）精神，積極進取，（(５)）自己的價值，它將是一段美麗、愉悅的旅途。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"cloze-3":{"id":"cloze-3","section":"cloze","number":3,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":3,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　誰不眷戀生命呢？但是，有人慷慨悲歌，（(１)）赴死，為的是讓生命具有意義，以一己之死，喚醒眾人的覺醒，將個人短暫的生命作最（(２)）的發揮。他以自己的一生織就了永不磨滅的圖案，讓世人永遠（(３)）、喝采。\n　　痛苦與歡樂、成功與失敗……，交織而成人生的圖。灰心（(４)）的陰影或許深重，但遠方的陽光依舊亮麗，就如同黑夜（(５)）讓人恐懼，但，黎明的一刻總會來臨。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"cloze-4":{"id":"cloze-4","section":"cloze","number":4,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":4,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　夏日嘹亮的蟬鳴，你可知牠在地洞中（(１)）多少時間？（(２)）飛舞的蝴蝶，你可知是經過醜陋的毛毛蟲，正是多日來（(３)）的痛苦蛻變成的嗎？小樹成大材，須經歷無數（(４)）的襲擊；梅花的（(５)），須經嚴冬的寒凍徹骨。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-1":{"id":"group-1","section":"group","number":1,"parts":[{"kind":"p","text":"閱讀題組：愛蓮說中周敦頤藉蓮的特質說明君子的種種美德，並自我期許。時至今日，即使科技進步、價值觀多元，培養良好的品格仍是學習的重要課題，請就以下提供的資訊，回答各問題。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":1,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"做個好品格的現代人\n　　品格影響人一生的發展，表一是孔子勉勵弟子修德的一些內容，表二是天下雜誌對現代青少年應具備的品格項目所做的問卷調查。兩個表格可以看出古今對品格的要求皆有其共通性，如「己所不欲，勿施於人」就是現在所謂的同理心。這些資訊都可以提供我們修養品格的參考。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"￰0￱","images":[],"inlineImages":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAc8AAAHHCAIAAABWSUQRAAAAA //nX5TKjiIRAoTA3hD4xT9u/I2CzHIvlCn/z38sDjtTIAQIgWMh8It/rBQ6leQfEPy58t8RP4/VLVQOIQAIADuL74pK+tyGSM3+j79Lvrc0bAiBIyHw69/9RWONQ2YRPdnM/fnfPVLVqBhC4IMj8OPv/mmraN2JsBTSk7n/82/9vfMPjho1nxA4AgK/eviF3Fp7IWsxPdkv/5n3s7/zkyPUjoogBD4wAr96+N/+nb+9TnSulZ7whevwn/2cJOgHHjrU9EMj8Pu/+H0J7kl/JqyRnpjC/b0/+cnf+lvZE2iHrjLlTwh8BAR+9ePv//jrnyrPSM71a88An1+63p+wn/7kr5y94TtOPkJXUxvfFgJf/68/+D9//Rvy38gd78w14xnpKeLyX/4JvIn8tlpPtSUEKo2AJP21v/rX/mqZKm6iZ5k8KA4hQAgcBIG819BBiqFMCQFCYHsEiJ7bY0YpCIEjIUD0PBLQVAwhsD0CRM/tMaMUhMCRECB6HgloKoYQ2B4Bouf2mFEKQuBICBA9jwQ0FUMIbI8A0XN7zCgFIXAkBIieRwKaiiEEtkeA6Lk9ZpSCEDgSAkTPIwFNxRAC2yNA9NweM0pBCBwJAaLnkYCmYgiB7REgem6PGaUgBI6EwP8NfhP9Z+rIU+AAAAAASUVORK5CYII=","legacy":false,"ext":"png","rid":"rId7"}],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-2":{"id":"group-2","section":"group","number":2,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":2,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　我的朋友李公擇，年輕時在廬山　五老峰下白石庵的僧屋裡讀書。公擇離開之後，山中的人很思念他，便指公擇所住的稱為李氏山房，藏書共有九千餘卷。公擇既已涉足於各類書籍的流派，深究各家學術理論的淵源，採取書籍裡華麗的文辭和充實的內容，而品嘗書籍裡豐腴的思想和雋美的情趣。把它吸收消化作為自己所有的學問；然後發表在文章中和表現在所行之事中，因此成為當代有名的人了；可是書籍還是如舊，不曾有些微的損失，他將要把這些書籍留傳給後世的人，供其作求無窮盡的學問，依各人才能天分的高低，而決定其所能得的學問。因此公擇不把這些書籍藏在家中，卻藏在所居的僧屋中，這是有愛人之德的人的一片好心啊！","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（改寫自蘇軾　李君山房記）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-3":{"id":"group-3","section":"group","number":3,"parts":[{"kind":"p","text":"請在閱讀後回答問題。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":3,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　據說武則天稱帝後，在冬月某日遊賞御花園，醺醉時寫了臘日宣詔幸上苑一詩：「明朝遊上苑，火急報春知。花須連夜發，莫待曉風吹。」作為詔令，令眾花神催開百花。隔天百花齊放，唯牡丹花神傲骨，獨不奉詔，武則天遂將牡丹花神貶至洛陽。牡丹移植洛陽後，開得滿山遍野，譽滿天下。武則天聽說後，下令把牡丹全部燒掉，誰知來年春天，被燒焦的枝幹上竟開出更紅豔的牡丹。後人便將之稱為「焦骨牡丹」。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（取材自事物紀原）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"註：苑：皇家的園林。\n　　奉詔：接受皇帝的命令。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-4":{"id":"group-4","section":"group","number":4,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":4,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　六月早晨，醒來太早，\n　　重回夢鄉又太晚。\n　　我必須走出去—綠色住滿\n　　記憶，記憶用目光跟隨我。\n　　它們無形，完全與背景\n　　□在一起，真正的變色蜥蜴。\n　　如此近，我可以聽到它們呼吸\n　　雖然鳥鳴聲□□□□。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（2011　年諾貝爾文學獎得主瑞典　特朗斯特羅默）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-5":{"id":"group-5","section":"group","number":5,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":5,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　夜雪大作。時欲登舟至沙市，竟為雨雪所阻。然萬竹中雪子敲戛，錚錚有聲，暗窗紅火，任意看數卷書，意復有少趣。自嘆每有欲往，輒復不遂。然流行坎止，任之而已。魯直所謂「無處不可寄一夢」也。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（節錄自袁中道　江行日記）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"註：敲戛：敲打。\n　　流行坎止：承流則進，遇坎則止。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-6":{"id":"group-6","section":"group","number":6,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":6,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　永之氓咸善游。一日，水暴甚。有五、六氓乘小船絕湘水。中濟，船破，皆游。\n　　有一氓盡力而不能尋常。其侶曰：「汝善游最也，今何後為？」曰：「吾腰千錢，重，是以後。」曰：「何不去之！」不應，搖其首。\n　　有頃，益怠。已濟者立岸上，呼且號，曰：「汝愚之甚、蔽之甚！身且死，何以貨為？」又搖其首，遂溺死。\n　　吾哀之，且若是，得不有大貨之溺大氓者乎？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（節錄自柳宗元　柳河東集）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"註：永：地名，永州。\n　　氓：百姓。\n　　水暴甚：水暴漲得厲害。\n　　「絕」湘水：橫渡。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　不能「尋常」：度量單位，古代八尺為尋，倍尋為常。比喻狹小的地方。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　且若是：還像這樣。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-7":{"id":"group-7","section":"group","number":7,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":7,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　筍長成之後便是竹，它是天生合群，修竹千竿，一樣的碧綠，一樣的粗細，一樣的筆直，表現了整體的美。\n　　人們對於筍和竹有特別的偏愛，這是有道理的。竹的外表修長，筍的外型俊俏。竹頂天立地，清風亮節；筍質清味美，不論葷食素食，無不佳妙。\n　　文人雅士一向以竹比君子，以今天的眼光看，它的合群性、整體美，更值得現代人讚賞。筍無菜不可用，而且有了它的配合更為出色，也是對人處世的最好啟示。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（鄭勝竹　筍與竹）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"註：俊俏：容貌俊美秀麗，性情伶俐聰明。\n　　清風亮節：品行清白、高尚。\n　　葷食：動物質的食物。葷，音ㄏㄨㄣ。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-8":{"id":"group-8","section":"group","number":8,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":8,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　山光忽西落，池月漸東上。\n　　散髮乘夕涼，開軒臥閑敞。\n　　荷風送香氣，竹露滴清響。\n　　欲取鳴琴彈，恨無知音賞。\n　　感此懷故人，中宵勞夢想。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（孟浩然　夏日南亭懷辛大）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-9":{"id":"group-9","section":"group","number":9,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":9,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"【甲】　洛陽之俗，大抵好花，春時城中無分貴賤皆插花，雖負擔者亦然。花開時，士庶競為遊遨。往往於古寺廢宅有池臺處，為市井張幄幕，笙歌之聲相聞。最盛於月陂堤、張家園、棠棣坊、長壽寺東街與郭令宅。至花落乃罷。洛陽至東京六驛，舊不進花。自今徐州　李相迪為留守時，始進御。歲遣衙校一員，乘驛馬，一日一夕至京師。所進不過姚黃、魏紫三數朵。以菜葉實竹籠子，藉覆之使馬上不動搖，以蠟封花蒂，乃數日不落。大抵洛人家家有花，而少大樹者，蓋其不接則不佳。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（節錄自歐陽脩　洛陽牡丹記）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"【乙】　無性生殖是指生物體直接由母體細胞分裂後產生出新個體的生殖方式。主要分為分裂生殖（通常是單細胞生物所行的生殖方式）、出芽生殖（某些生物個體上會長出一個較小的芽體。這個芽體在經過不斷地細胞分裂後會脫離母體，成為獨立的新個體）、斷裂生殖（通常是多細胞生物受外力作用斷裂後發育為新個體）、營養器官繁殖（植物的根、莖、葉等營養器官通過與母體脫離後，即能夠發育成新的個體）等方式。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（維基百科）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"註：姚黃、魏紫：宋代　洛陽兩種名貴的牡丹品種。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"group-10":{"id":"group-10","section":"group","number":10,"parts":[{"kind":"p","text":"","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":10,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"　　有疑陶淵明詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。\n註：莫之與「京」：齊等。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"（改寫自蕭統　陶淵明集序）","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"〔107.會考〕","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"}]},"match-2":{"id":"match-2","section":"match","number":2,"parts":[{"kind":"p","text":"誰是知己：張潮在幽夢影提到：世上能有一個知己，便可以不再遺憾。如「琵琶以明妃（王昭君）為知己」、「菊以淵明為知己」。不僅「人」是這樣，「物」也是如此。下列各「物」，是以何「人」為知己？請根據參考選項，將適當的答案填入（　）中。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":2,"style":"Normal_c2d13f02-5c3f-4f47-9045-c416fa0b220a"},{"kind":"p","text":"參考選項：(Ａ)右軍（王羲之）　(Ｂ)陸羽　(Ｃ)濂溪　\n(Ｄ)太真（楊貴妃）","images":[],"inlineImages":[],"mathE function cellsToTable(rows,caption='',source='manual-table'){
 const clean=(rows||[]).map(row=>(row||[]).map(v=>({text:String(v??'').trim(),images:[],inlineImages:[]})));
 const width=Math.max(0,...clean.map(r=>r.length));
 if(!width||clean.length<1||width>18||clean.length>120) return null;
 return {kind:'table',rows:clean.map(row=>[...row,...Array.from({length:width-row.length},()=>({text:'',images:[],inlineImages:[]}))]),caption:String(caption||''),source,placement:'stem'};
}
function tableAsTSV(table){return (table?.rows||[]).map(row=>row.map(cell=>String(cell.text||'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n')}
function tsvAsTable(text,caption=''){
 let lines=String(text||'').trim().replace(/\r/g,'').split('\n').filter(line=>line.trim());
 if(!lines.length)return null;
 if(lines.length>120)throw Error('表格超過 120 列，請分拆');
 const cells=lines.map(line=>line.split('\t').map(x=>x.trim()));
 if(Math.max(...cells.map(row=>row.length))>18)throw Error('表格超過 18 欄，請分拆');
 return cellsToTable(cells,caption,'teacher-edited-table')
}
function findStemTable(q){return(q?.parts||[]).find(p=>p.kind==='table'&&p.placement!=='option')||null}

/* 10.0 將系統產生的 WMF 向量公式收緊至可見筆畫範圍，保留 SVG 清晰度。
   僅限安全白名單的本系統 SVG；其他圖片維持原樣。 */
const mathVectorLayoutCache=new Map();
function compactLegacySvg(source){
 if(!source||!source.startsWith('data:image/svg+xml;base64,'))return source;
 if(mathVectorLayoutCache.has(source))return mathVectorLayoutCache.get(source);
 let fitted=source;
 try{
  const binary=atob(source.slice(source.indexOf(',')+1));
  if(binary.length>400000)throw Error('large SVG');
  const markup=new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0)));
  // 只處理自動 WMF 轉出且沒有外部資源或可執行標記的 SVG。
  if(!markup.includes('<g stroke-linecap="round" stroke-linejoin="round">')||/<(?:script|foreignObject|image|use|style|animate|set)\b|\bon[a-z]+\s*=|(?:xlink:)?href\s*=|url\s*\(/i.test(markup))throw Error('unsupported SVG');
  const doc=new DOMParser().parseFromString(markup,'image/svg+xml'),root=doc.documentElement;
  if(root.localName!=='svg'||root.querySelector('parsererror'))throw Error('bad SVG');
  for(const el of root.querySelectorAll('*'))if(!['g','path','polyline','rect','text'].includes(el.localName))throw Error('unsafe SVG node');
  const probe=document.importNode(root,true);
  probe.style.cssText='position:absolute;left:-99999px;top:-99999px;visibility:hidden;pointer-events:none';
  probe.setAttribute('width','250');probe.setAttribute('height','250');
  document.body.appendChild(probe);
  let box;
  try{box=probe.querySelector('g').getBBox()}finally{probe.remove()}
  if(!box||!isFinite(box.width)||!isFinite(box.height)||box.width<1||box.height<1||box.width>40000||box.height>40000)throw Error('invalid bbox');
  const pad=Math.max(7,Math.max(box.width,box.height)*.065),x=box.x-pad,y=box.y-pad,w=box.width+2*pad,h=box.height+2*pad;
  root.setAttribute('viewBox',[x,y,w,h].map(n=>Number(n.toFixed(2))).join(' '));
  root.setAttribute('width',String(Math.max(12,Math.round(100*w/h))));root.setAttribute('height','100');
  const out=new XMLSerializer().serializeToString(root);
  fitted='data:image/svg+xml;base64,'+btoa(Array.from(new TextEncoder().encode(out),b=>String.fromCharCode(b)).join(''));
 }catch(e){fitted=source}
 // 來源與輸出皆使用圖片，不轉成網頁中可執行的 SVG 內容。
 if(mathVectorLayoutCache.size>2200)mathVectorLayoutCache.clear();
 mathVectorLayoutCache.set(source,fitted);
 return fitted;
}

}
/* 安全的數學文字排版：教師可輸入 LaTeX 的 frac / dfrac / sqrt，使用瀏覽器原生 MathML。 */
/* APP20: preserve true Word super/subscripts, and render algebra with mathematical typesetting.
   Render only formula-like spans, not ordinary 2 in dates/question numbers. */
function algebraMathML(expression){
 const txt=String(expression||'').replace(/[＋]/g,'+').replace(/[－−]/g,'−').replace(/[＝]/g,'=')
   .replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[×]/g,'×').replace(/[÷]/g,'÷');
 const powerDigits={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
 const opens=new Set(['(','[','{']),closes={')':'(',']':'[','}':'{'},frames=[{open:'',tokens:[]}];
 const wrap=t=>'<mrow>'+t.join('')+'</mrow>',put=x=>frames[frames.length-1].tokens.push(x);
 for(let i=0;i<txt.length;){
  const ch=txt[i];
  if(opens.has(ch)){frames.push({open:ch,tokens:[]});i++;continue}
  if(closes[ch]&&frames.length>1&&frames[frames.length-1].open===closes[ch]){
   const frame=frames.pop();put('<mrow><mo>'+esc(frame.open)+'</mo>'+wrap(frame.tokens)+'<mo>'+esc(ch)+'</mo></mrow>');i++;continue;
  }
  if(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(ch)||ch==='^'){
   let p='';if(ch==='^'){
    i++;if(txt[i]==='{'){i++;while(i<txt.length&&txt[i]!=='}'){p+=txt[i++]}if(txt[i]==='}')i++}
    else while(i<txt.length&&/[0-9n+-]/.test(txt[i]))p+=txt[i++];
   }else {while(i<txt.length&&powerDigits[txt[i]]!==undefined)p+=powerDigits[txt[i++]]}
   if(p&&frames[frames.length-1].tokens.length){const prev=frames[frames.length-1].tokens.pop();put('<msup>'+prev+'<mn>'+esc(p)+'</mn></msup>')}
   else put('<mtext>'+esc(ch)+'</mtext>');continue;
  }
  if(/[0-9]/.test(ch)){let j=i+1;while(j<txt.length&&/[0-9.]/.test(txt[j]))j++;put('<mn>'+esc(txt.slice(i,j))+'</mn>');i=j;continue}
  if(/[a-zA-Zαβγπθ]/.test(ch)){put('<mi>'+esc(ch)+'</mi>');i++;continue}
  if(/\s/.test(ch)){put('<mspace width=".16em"/>');i++;continue}
  put('<mo>'+esc(ch)+'</mo>');i++;
 }
 while(frames.length>1){const f=frames.pop();frames[frames.length-1].tokens.push('<mo>'+esc(f.open)+'</mo>',...f.tokens)}
 return '<span class="math-fraction math-universal algebra-inline" role="math" aria-label="'+esc(expression)+'"><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline">'+wrap(frames[0].tokens)+'</math></span>';
}
function algebraFormattedText(value){
 const s=String(value??'');
 // First isolate likely algebra runs. A plain numeral or a date is never a power.
 const rx=/[A-Za-z0-9αβγπθ（(][A-Za-z0-9αβγπθ＋+－−\-×÷＝=（）()\[\]{}⁰¹²³⁴⁵⁶⁷⁸⁹^·.]*[A-Za-z0-9αβγπθ）)⁰¹²³⁴⁵⁶⁷⁸⁹]/g;
 let out='',pos=0,m;
 while((m=rx.exec(s))){
  const candidate=m[0];
  // Mathematical variable + an operation/power; prevent matching ordinary prose or A/B labels.
  const isFormula=/[a-zA-Zαβγπθ]/.test(candidate)&&/[+＋−－\-＝=×÷⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(candidate)&&
    (/[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(candidate)||/[+＋−－\-=＝]/.test(candidate))&&
    !/^[A-Za-z]{3,}\d*$/.test(candidate);
  if(!isFormula)continue;
  out+=esc(s.slice(pos,m.index)).replace(/\n/g,'<br>')+algebraMathML(candidate);pos=rx.lastIndex;
 }
 return out+esc(s.slice(pos)).replace(/\n/g,'<br>');
}
function mathFormattedText(s){
 // MathML retains superscript and correct alignment in the question, options, and explanations.
 // TeX is handled by the existing universal engine; non-maths subjects retain the old behavior.
 return (typeof bank!=='undefined'&&bank?.subject==='數學'&&!/\\[A-Za-z]+/.test(String(s)))
   ?algebraFormattedText(s):universalMathFormattedText(s);
}

function studySteps(q){
 const steps=[];
 if(q.studyTip?.trim())steps.push({html:'<p>'+textHtml(q.studyTip)+'</p>',title:'老師補充提醒'});
 // The original Word paragraphs preserve OMML, MathType converted drawings, tables and line order.
 const parts=(q.explanationParts||[]).filter(p=>p.kind==='table'||String(p.text||'').trim()||p.inlineImages?.length||p.images?.length);
 if(parts.length){
  for(const p of parts){
   if(p.kind==='table'){steps.push({html:partHTML(p),title:'圖表／解題資料'});continue}
   const pieces=String(p.text||'').split(/\n+/).filter(t=>t.trim());
   if(pieces.length<=1){steps.push({html:partHTML(p),title:'解析步驟'});continue}
   // Only split pure-text paragraphs; do not destroy inline drawing positions.
   if(p.inlineImages?.length||p.images?.length){steps.push({html:partHTML(p),title:'附公式／圖形的解析'});continue}
   for(const t of pieces)steps.push({html:'<p>'+mathFormattedText(t)+'</p>',title:'解析步驟'});
  }
 }else if(q.explanation?.trim()){
  const chunks=String(q.explanation).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(chunks.length>1)chunks.forEach(t=>steps.push({html:'<p>'+mathFormattedText(t)+'</p>',title:'解析步驟'}));
  else steps.push({html:'<p>'+mathFormattedText(q.explanation)+'</p>',title:'解析說明'});
 }

}

function parseQuestion(q){

 for(const p of q.parts||[]){if(p.kind!=='p'){(p.kind==='table'&&p.placement==='stem'?stem:(optionMode&&current?current.parts:stem)).push(partHTML(p));continue}

function isKangxuanBank(blocks){

  }
 }
 for(const key of Object.keys(result.entries))if(/^fill-\d+$/.test(key)&&Array.isArray(result.entries[key].referenceAnswers)&&result.entries[key].referenceAnswers.length)delete result.entries[key];

/* APP 15.0: 康軒英語 DOCX 專用規則。輸入保持原 Word 段落及圖片，不依賴特定單元題目。 */

function kxNewQ(section,n,part,sub=null,group=null){

function kxEnglishGroupSplit(p){

function parseKangxuanEnglishBlocks(blocks,filename){

      data.warnings.push(`第 ${n} 組未找到獨立組號，已自動建立，請確認`);

       data.questions.push(kxNewQ(sec,Number(data.groups[activeGroup].number),part,sub,activeGroup));
      }

function kxEnglishAnswerSlots(s){

  }
  return s.split(/[；;]/).map(x=>x.trim()).filter(Boolean);
}
function kxEnglishDetailSlots(detail){

  return Object.fromEntries(markers.map((m,i)=>[Number(m[1]),detail.slice(m.index+m[0].length,i+1<markers.length?markers[i+1].index:detail.length).trim()]));
}
function parseKangxuanEnglishAnswerBlocks(blocks,filename,stats){

function matchSubMarker(s){let m=norm(s||'').match(/[（(]\s*([1-9][0-9]?)\s*[）)]/);return m?Number(m[1]):null}

   }
   if(sub!==null&&blank){

function scratchSetCanvasSize(){if(!scratchCanvas||!scratchCtx)return;scratchDpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(280,Math.round(scratchCanvas.getBoundingClientRect().width||500));const h=310;scratchCanvas.width=Math.round(w*scratchDpr);scratchCanvas.height=Math.round(h*scratchDpr);scratchCtx.setTransform(scratchDpr,0,0,scratchDpr,0,0);scratchCtx.fillStyle='#fff';scratchCtx.fillRect(0,0,w,h);scratchCtx.lineCap='round';scratchCtx.lineJoin='round'}

e 'scratchClear':scratchClear();break;case 'scratchSave':scratchSave();break;case 'scratchPen':scratchTool='pen';scratchUpdateControls();break;case 'scratchErase':scratchTool='erase';scratchUpdateControls();break;case 'shareWrongPdf':shareWrongPdf();break;case 'saveWrongPdf':saveWrongPdf();break;case 'downloadWrong':{let ids=preparePrint(),doc='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>錯題本</title><style>body{font:17px/1.65 sans-serif;max-width:850px;margin:25px auto;padding:15px}img{max-width:90%;max-height:360px}table{border-collapse:collapse}td{border:1px solid #555;padding:5px}.report-item{break-inside:avoid;border-bottom:1px solid #aaa}.report-footer{break-before:page;margin-top:30px}</style></head><body><h1>'+esc(bank.title)+'　錯題本</h1>'+wrongBookHTML(ids,true)+'</body></html>';if(ids.length)download(safeFilename(bank.title)+'_錯題本.html',doc);else toast('目前沒有需要輸出的題目');break}case 'gmail':{let email=$('teacherEmail')?.value.trim(),name=$('mailStudentName')?.value.trim();if(!email||!/^\S+@\S+\.\S+$/.test(email)){toast('請先輸入有效的收件 Gmail 信箱');return}state.name=name||state.name;let url='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(email)+'&su='+encodeURIComponent(bank.title+'｜電子測驗交卷｜'+state.name)+'&body='+encodeURIComponent(reportText());window.open(url,'_blank','noopener,noreferrer');break}case 'copyReport':{navigator.clipboard?.writeText(reportText()).then(()=>toast('成績摘要已複製'),()=>fallbackCopy(reportText()))||fallbackCopy(reportText());break}case 'saveEdit':saveEdit(el.dataset.id);break;
 case 'hwToggle':hwToggle(el.dataset.id);break;case 'hwPen':hwTool(el.dataset.id,'pen');break;case 'hwEraser':hwTool(el.dataset.id,'eraser');break;case 'hwUndo':hwUndo(el.dataset.id);break;case 'hwClear':hwClear(el.dataset.id);break;case 'hwDownload':hwDownload(el.dataset.id);break;case 'hwExportRecord':hwExportRecord();break;case 'studyNext':{let q=getQ(el.dataset.id);if(q){state.studyReveal??={};state.studyReveal[q.id]=Math.min(studySteps(q).length,(state.studyReveal[q.id]||0)+1);render()}break}
